$kind: http-request
url: "{{baseUrl}}/products"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns a list of products', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 1000
